<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" width="720" height="348" role="img" aria-labelledby="fig-1-4-title fig-1-4-desc" class="sv-fig" data-fig="fig-1-4">
<title id="fig-1-4-title">[ FIG 1.4 // SAMPLING ] A 15-second scrape misses a 4-second spike 73% of the time</title>
<desc id="fig-1-4-desc">Time axis from 0 to 30 seconds with a red band from 6.5 to 10.5 s marking a 4-second latency spike. Three rows of scrape ticks. Every 1 s puts 4 samples inside the spike, every 5 s puts 1, and every 15 s (samples at 0, 15 s) puts none in this worst-case phase. Over a random phase the chance that a 4-second spike holds no sample is 0 percent at 1 s, 20 percent at 5 s and 73 percent at 15 s, computed as the interval minus the spike length, over the interval.</desc>
<rect x="0.5" y="0.5" width="719" height="347" rx="6" fill="#181a1c" stroke="#2e3438" stroke-width="1" style="fill:var(--fig-bg, #181a1c);stroke:var(--fig-hair, #2e3438)"/>
<text x="32" y="36" font-family="Martian Mono, DM Mono, ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0.12em" fill="#a4a9ac" style="fill:var(--fig-muted, #a4a9ac)">[ FIG 1.4 // SAMPLING ]</text>
