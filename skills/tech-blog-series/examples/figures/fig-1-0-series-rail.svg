<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" width="720" height="328" role="img" aria-labelledby="fig-1-0-title fig-1-0-desc" class="sv-fig" data-fig="fig-1-0">
<title id="fig-1-0-title">[ FIG 1.0 // THE PIPELINE ] Getting from a log line to an alert is a chain of six jobs</title>
<desc id="fig-1-0-desc">Six jobs in order, drawn as cards in two rows of three: collect logs (post 1), parse and enrich (not covered in this series), store and index (post 1), detect anomalies (post 2), alert (post 2), review and tune (post 3). Collect logs and store and index are highlighted as this post&#x27;s subject.</desc>
