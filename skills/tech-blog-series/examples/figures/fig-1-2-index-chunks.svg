<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-labelledby="fig-1-2-title fig-1-2-desc" class="sv-fig" data-fig="fig-1-2">
<title id="fig-1-2-title">[ FIG 1.2 // THE INDEX ] A query reads only the few chunks that cover its window</title>
<desc id="fig-1-2-desc">A log index splits by service, then by time. The api service has six closed chunks in time order, starting at 12:00, 12:08, 12:15, 12:23, 12:31, 12:38, drawn with widths proportional to their sizes (64, 64, 48, 64, 56, 64 MB). A seventh chunk, dashed, is still being written. A query for 12:26 to 12:42 overlaps only the chunks starting at 12:23, 12:31, 12:38, so it reads only those 3. Sizes are illustrative.</desc>
<rect x="0.5" y="0.5" width="719" height="409" rx="6" fill="#181a1c" stroke="#2e3438" stroke-width="1" style="fill:var(--fig-bg, #181a1c);stroke:var(--fig-hair, #2e3438)"/>
<text x="32" y="36" font-family="Martian Mono, DM Mono, ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0.12em" fill="#a4a9ac" style="fill:var(--fig-muted, #a4a9ac)">[ FIG 1.2 // THE INDEX ]</text>
<text x="32" y="62" font-family="Hanken Grotesk, Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#dde1e4" style="fill:var(--fig-ink, #dde1e4)">A query reads only the few chunks that cover its window</text>
