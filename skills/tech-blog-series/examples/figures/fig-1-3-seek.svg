<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" role="img" aria-labelledby="fig-1-3-title fig-1-3-desc" class="sv-fig" data-fig="fig-1-3">
<title id="fig-1-3-title">[ FIG 1.3 // SEEKING ] Reading from the chunk start returns too much. Seeking to the timestamp returns the window.</title>
<desc id="fig-1-3-desc">Four chunks of the api service on one time axis, starting at 12:15, 12:23, 12:31, 12:38. The query starts at 12:26, inside the chunk that starts at 12:23, and ends at 12:42. Top row, reading from the chunk start: the reader jumps to 12:23 and reads on, so the result starts 3 minutes too early. Bottom row, seeking to the timestamp: the lines from 12:23 to 12:26 are skipped, and the result runs exactly from the query start to the query end.</desc>
<rect x="0.5" y="0.5" width="719" height="365" rx="6" fill="#181a1c" stroke="#2e3438" stroke-width="1" style="fill:var(--fig-bg, #181a1c);stroke:var(--fig-hair, #2e3438)"/>
<text x="32" y="36" font-family="Martian Mono, DM Mono, ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0.12em" fill="#a4a9ac" style="fill:var(--fig-muted, #a4a9ac)">[ FIG 1.3 // SEEKING ]</text>
<text x="32" y="62" font-family="Hanken Grotesk, Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#dde1e4" style="fill:var(--fig-ink, #dde1e4)">Reading from the chunk start returns too much.</text>
<text x="32" y="84" font-family="Hanken Grotesk, Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#dde1e4" style="fill:var(--fig-ink, #dde1e4)">Seeking to the timestamp returns the window.</text>
