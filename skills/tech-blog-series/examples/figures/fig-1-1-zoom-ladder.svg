<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 383" width="720" height="383" role="img" aria-labelledby="fig-1-1-title fig-1-1-desc" class="sv-fig" data-fig="fig-1-1">
<title id="fig-1-1-title">[ FIG 1.1 // SCALE ] The incident that matters lasts seconds in a day of logs</title>
<desc id="fig-1-1-desc">Three zoom levels. One day of traffic is 86,400 seconds, with a tiny highlighted span. That span expands to one minute, 60 seconds, with a short red span. That span expands to the incident window, 4 seconds, drawn as 4 light red one-second cells. The incident is about 0.005 percent of the day.</desc>
<rect x="0.5" y="0.5" width="719" height="382" rx="6" fill="#181a1c" stroke="#2e3438" stroke-width="1" style="fill:var(--fig-bg, #181a1c);stroke:var(--fig-hair, #2e3438)"/>
<text x="32" y="36" font-family="Martian Mono, DM Mono, ui-monospace, monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0.12em" fill="#a4a9ac" style="fill:var(--fig-muted, #a4a9ac)">[ FIG 1.1 // SCALE ]</text>
<text x="32" y="62" font-family="Hanken Grotesk, Inter, system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#dde1e4" style="fill:var(--fig-ink, #dde1e4)">The incident that matters lasts seconds in a day of logs</text>
