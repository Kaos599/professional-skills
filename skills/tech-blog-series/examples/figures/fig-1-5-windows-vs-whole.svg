<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" width="720" height="548" role="img" aria-labelledby="fig-1-5-title fig-1-5-desc" class="sv-fig" data-fig="fig-1-5">
<title id="fig-1-5-title">[ FIG 1.5 // FEEDING A DETECTOR ] Fixed windows, sliding windows and whole incidents feed a detector differently</title>
<desc id="fig-1-5-desc">Three rows. Fixed windows: traffic cut into 1-minute windows, five closed and a sixth, dashed, still open. A spike, drawn as a dot early in the third window, waits for the window to close before that window goes to the detector. Sliding windows: a short stretch of the whole day zooms out to five overlapping windows. A 5-minute window slides one step per minute. Whole incident: one incident goes in whole, start to end, as one input, and it waits for the incident to end. In each row the one detector input is highlighted.</desc>
