<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" role="img" aria-labelledby="fig-1-6-title fig-1-6-desc" class="sv-fig" data-fig="fig-1-6">
<title id="fig-1-6-title">[ FIG 1.6 // DETECTION DELAY ] The alert fires 27 seconds after the incident starts</title>
<desc id="fig-1-6-desc">Time axis from 0 to 120 seconds. Top row, the detector&#x27;s two 1-minute windows. Middle row, the true incident: a 4-second red band starting at 38 s. Bottom row, the alert, a marker at 65 s, after the first window closes at 60 s and the check runs for 5 s. A bracket from the incident start to the alert is labelled detection delay, 27 s.</desc>
